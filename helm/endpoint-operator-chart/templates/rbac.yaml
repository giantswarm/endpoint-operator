apiVersion: rbac.authorization.k8s.io/v1beta1
kind: ClusterRole
metadata:
  name: endpoint-operator
  namespace: giantswarm
rules:
  - apiGroups:
      - ""
    resources:
      - services
    verbs:
      - get
      - create
  - apiGroups:
      - ""
    resources:
      - endpoints
    verbs:
      - get
      - create
      - update
      - delete
---
apiVersion: rbac.authorization.k8s.io/v1beta1
kind: ClusterRoleBinding
metadata:
  name: userd
subjects:
  - kind: ServiceAccount
    name: endpoint-operator
roleRef:
  kind: ClusterRole
  name: endpoint-operator
  apiGroup: rbac.authorization.k8s.io
